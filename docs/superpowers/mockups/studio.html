<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гардероб — Студия</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .f { font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* A photo studio: a seamless backdrop and one key light, tinted by the piece standing in it. */
  .base { background: radial-gradient(80% 50% at 50% 44%, #FFFFFF 0%, #F2F2F0 60%, #E4E4E1 100%); }
  .tint { position: absolute; inset: 0; transition: background-color 1.1s ease, opacity 1.1s ease; mix-blend-mode: multiply;
          -webkit-mask-image: radial-gradient(60% 36% at 50% 46%, #000 0%, rgba(0,0,0,.55) 45%, transparent 80%);
                  mask-image: radial-gradient(60% 36% at 50% 46%, #000 0%, rgba(0,0,0,.55) 45%, transparent 80%); }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @keyframes shadow { 0%,100% { transform: translateX(-50%) scaleX(1); opacity: .42 } 50% { transform: translateX(-50%) scaleX(.84); opacity: .26 } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes sheen { 0% { transform: translateX(-140%) } 60%,100% { transform: translateX(260%) } }
  .float { animation: float 5s ease-in-out infinite; }
  .floor { animation: shadow 5s ease-in-out infinite; background: rgba(18,20,24,.5); filter: blur(14px); left: 50%; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .hero { transition: transform .55s cubic-bezier(.2,.7,.2,1), opacity .45s ease, filter .45s ease; }
  .hero.out-l { transform: translateX(-70px) scale(.92); opacity: 0; filter: blur(10px); }
  .hero.out-r { transform: translateX(70px) scale(.92); opacity: 0; filter: blur(10px); }
  .side { transition: all .55s cubic-bezier(.2,.7,.2,1); filter: blur(4px) saturate(.7); opacity: .45; }
  .swap { transition: opacity .35s ease, transform .35s ease; }
  .swap.hide { opacity: 0; transform: translateY(6px); }
  .glass { background: rgba(255,255,255,.55); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px rgba(0,0,0,.08); }
  .sheen::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); animation: sheen 4.5s ease-in-out infinite; }
  .thumb { transition: all .4s cubic-bezier(.2,.7,.2,1); }
  .thumb.on { transform: translateY(-8px); background: #fff; box-shadow: 0 10px 22px rgba(0,0,0,.10), inset 0 0 0 1px rgba(0,0,0,.04); }
  .sheet { transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s ease; }
  .sheet.closed { transform: translateY(105%); opacity: .6; pointer-events: none; }
  .veil { transition: opacity .4s ease, backdrop-filter .4s ease; }
  .veil.closed { opacity: 0; pointer-events: none; }
  .tile { transition: transform .3s ease; }
  .tile:active { transform: scale(.97); }
  .noscroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app" class="base f relative mx-auto overflow-hidden text-[#121417] select-none" style="width:390px;height:844px;">
  <div id="tint" class="tint" style="background-color:#BFDCCF"></div>

  <div class="relative">
    <div class="h-[54px]"></div>

    <!-- Header: the wardrobe, its size, the way to see everything at once, and adding a piece -->
    <div class="px-5 flex items-center justify-between rise">
      <div>
        <span class="text-[15px] font-semibold tracking-[-0.2px]">Гардероб</span>
        <span id="count" class="text-[13px] text-[#7A7F87] ml-1">7</span>
      </div>
      <div class="flex items-center gap-2">
        <a id="open-all" href="#all-items" class="glass h-[38px] px-3.5 rounded-full flex items-center gap-1.5 text-[13px] font-semibold"><iconify-icon icon="ph:squares-four" class="text-[16px]"></iconify-icon>Все вещи</a>
        <a id="add" href="#add" class="w-[38px] h-[38px] rounded-full flex items-center justify-center bg-[#121417] text-white"><iconify-icon icon="ph:plus" class="text-[17px]"></iconify-icon></a>
      </div>
    </div>

    <!-- The piece in focus -->
    <div class="px-5 mt-6 rise" style="animation-delay:.08s">
      <div id="facts" class="swap flex items-center gap-2 text-[13px] text-[#6E737B]">
        <span id="f-kind">Верх, мохер и акрил</span>
        <span class="w-[3px] h-[3px] rounded-full bg-[#B5B9BF]"></span>
        <span id="f-season">весна и осень</span>
      </div>
      <h1 id="name" class="swap text-[34px] leading-[38px] font-semibold tracking-[-1px] mt-1 whitespace-nowrap overflow-hidden text-ellipsis">Зелёный кардиган</h1>
    </div>

    <!-- The stage: swipe or tap the row below; the piece in light is sharp, its neighbours soft -->
    <div id="stage" class="relative h-[364px] mt-1 touch-pan-y">
      <img id="prev" class="side absolute left-[-78px] top-[110px] w-[160px] object-contain" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/9beaebe2-7f09-4452-b892-15bff5f484a0/content-assets/cutout-b/b.png" alt="">
      <img id="next" class="side absolute right-[-82px] top-[96px] w-[168px] object-contain" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/9beaebe2-7f09-4452-b892-15bff5f484a0/content-assets/cutout-h/h.png" alt="">
      <div class="floor absolute bottom-[38px] w-[170px] h-[16px] rounded-full"></div>
      <div class="float absolute left-0 right-0 top-[14px] flex justify-center">
        <img id="hero" class="hero h-[286px] max-w-[290px] object-contain drop-shadow-[0_22px_28px_rgba(0,0,0,0.13)]" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/9beaebe2-7f09-4452-b892-15bff5f484a0/content-assets/cutout-c/c.png" alt="Зелёный кардиган">
      </div>
      <div id="pos" class="swap absolute right-5 bottom-[10px] text-[12px] text-[#7A7F87]">3 из 7</div>
    </div>

    <!-- Actions for the piece in focus -->
    <div class="px-5 flex gap-2 rise" style="animation-delay:.16s">
      <a id="try" href="#try" class="relative overflow-hidden sheen flex-1 h-[50px] rounded-full bg-[#121417] text-white flex items-center justify-center gap-2 text-[15px] font-semibold"><iconify-icon icon="ph:person-simple" class="text-[18px]"></iconify-icon>Примерить</a>
      <a id="pair" href="#pair" class="glass flex-1 h-[50px] rounded-full flex items-center justify-center gap-2 text-[15px] font-semibold"><iconify-icon icon="ph:stack" class="text-[17px]"></iconify-icon>С чем носить</a>
    </div>

    <!-- Sections, then the whole section as a row; the chosen piece lifted -->
    <div id="sections" class="mt-6 px-5 flex gap-4 text-[13px] rise" style="animation-delay:.24s"></div>
    <div id="strip" class="noscroll mt-3 pl-5 pr-5 flex items-end gap-2.5 overflow-x-auto pb-1 rise" style="animation-delay:.3s"></div>
  </div>

  <!-- Everything at once: a sheet over the blurred studio -->
  <div id="veil" class="veil closed absolute inset-0 bg-white/30 backdrop-blur-md"></div>
  <div id="sheet" class="sheet closed absolute left-0 right-0 bottom-0 h-[700px] rounded-t-[32px] bg-[#FAFAF9]/95 shadow-[0_-20px_60px_rgba(0,0,0,0.12)]">
    <div class="pt-3 flex justify-center"><span class="w-[38px] h-[5px] rounded-full bg-[#D5D7DA]"></span></div>
    <div class="px-5 mt-4 flex items-center justify-between">
      <span class="text-[22px] font-semibold tracking-[-0.6px]">Все вещи</span>
      <a id="close-all" href="#close" class="glass w-[36px] h-[36px] rounded-full flex items-center justify-center"><iconify-icon icon="ph:x" class="text-[16px]"></iconify-icon></a>
    </div>
    <div class="px-5 mt-3">
      <div class="h-[42px] rounded-full bg-[#EFEFED] flex items-center gap-2 px-4 text-[14px] text-[#8A8F96]"><iconify-icon icon="ph:magnifying-glass" class="text-[16px]"></iconify-icon>Найти вещь</div>
    </div>
    <div id="grid" class="noscroll px-5 mt-4 grid grid-cols-3 gap-2.5 overflow-y-auto h-[540px] pb-28"></div>
  </div>

  <!-- Floating glass tab bar -->
  <div class="absolute left-5 right-5 bottom-[26px] glass rounded-full h-[62px] flex items-center justify-around px-2 z-10">
    <a id="tab-wardrobe" href="#wardrobe" class="h-[46px] px-4 rounded-full bg-[#121417] text-white flex items-center gap-2 text-[13px] font-semibold"><iconify-icon icon="ph:coat-hanger" class="text-[19px]"></iconify-icon>Гардероб</a>
    <a id="tab-fitting" href="#fitting" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:person-simple" class="text-[22px]"></iconify-icon></a>
    <a id="tab-ideas" href="#ideas" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:stack" class="text-[21px]"></iconify-icon></a>
    <a id="tab-saved" href="#saved" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:heart" class="text-[21px]"></iconify-icon></a>
    <a id="tab-profile" href="#profile" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:user" class="text-[21px]"></iconify-icon></a>
  </div>
</div>

<script>
const U = 'https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/9beaebe2-7f09-4452-b892-15bff5f484a0/content-assets/';
const ITEMS = [
  { k: 'a', name: 'Белая футболка', kind: 'Верх, хлопок', season: 'лето', sec: 'Верх', tint: '#E3E7EE' },
  { k: 'b', name: 'Худи оверсайз', kind: 'Верх, футер', season: 'круглый год', sec: 'Верх', tint: '#E1E4EA' },
  { k: 'c', name: 'Зелёный кардиган', kind: 'Верх, мохер и акрил', season: 'весна и осень', sec: 'Верх', tint: '#BFDCCF' },
  { k: 'h', name: 'Свитшот с вышивкой', kind: 'Верх, хлопок', season: 'осень и зима', sec: 'Верх', tint: '#C9CEDA' },
  { k: 'd', name: 'Твидовое пальто', kind: 'Верхняя одежда, шерсть', season: 'осень', sec: 'Верхняя одежда', tint: '#D9D9D5' },
  { k: 'e', name: 'Голубые джинсы', kind: 'Низ, деним', season: 'круглый год', sec: 'Низ', tint: '#C3D3EA' },
  { k: 'g', name: 'Белые кеды', kind: 'Обувь, кожа', season: 'весна и лето', sec: 'Обувь', tint: '#E4E4E1' },
];
const SECTIONS = ['Всё', 'Верх', 'Низ', 'Верхняя одежда', 'Обувь'];
let section = 'Всё', list = ITEMS, i = 2, timer = null, touched = false;
const $ = id => document.getElementById(id);
const src = it => U + 'cutout-' + it.k + '/' + it.k + '.png';
// Pictures are set from data-k after the markup is built.
const fillImages = root => root.querySelectorAll('img[data-k]').forEach(img => { img.src = src({ k: img.dataset.k }); });

function renderSections() {
  $('sections').innerHTML = SECTIONS.map((s, n) =>
    `<a id="sec-${n}" href="#sec-${n}" data-s="${s}" class="${s === section ? 'text-[#121417] font-semibold' : 'text-[#7A7F87]'}">${s}${s === 'Всё' ? ` <span class="text-[#9A9EA4] font-normal">${ITEMS.length}</span>` : ''}</a>`).join('');
  $('sections').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); touched = true; section = a.dataset.s;
    list = section === 'Всё' ? ITEMS : ITEMS.filter(x => x.sec === section); i = 0; renderSections(); renderStrip(); show(0); });
}
function renderStrip() {
  $('strip').innerHTML = list.map((it, n) =>
    `<a id="th-${n}" href="#th-${n}" data-n="${n}" class="thumb shrink-0 w-[60px] h-[72px] rounded-[18px] bg-white/60 flex items-center justify-center">
       <img class="h-[52px] max-w-[48px] object-contain" data-k="${it.k}" alt=""></a>`).join('');
  fillImages($('strip'));
  $('strip').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); touched = true; const n = +a.dataset.n; show(n > i ? 1 : -1, n); });
}
function show(dir, to) {
  const next = to !== undefined ? to : (i + dir + list.length) % list.length;
  const hero = $('hero');
  if (dir) { hero.classList.add(dir > 0 ? 'out-l' : 'out-r'); ['facts', 'name', 'pos'].forEach(id => $(id).classList.add('hide')); }
  setTimeout(() => {
    i = next; const it = list[i];
    hero.src = src(it); hero.alt = it.name;
    hero.classList.remove('out-l', 'out-r');
    if (dir) { hero.classList.add(dir > 0 ? 'out-r' : 'out-l'); requestAnimationFrame(() => requestAnimationFrame(() => hero.classList.remove('out-l', 'out-r'))); }
    $('name').textContent = it.name; $('f-kind').textContent = it.kind; $('f-season').textContent = it.season;
    $('pos').textContent = `${i + 1} из ${list.length}`; $('count').textContent = ITEMS.length;
    ['facts', 'name', 'pos'].forEach(id => $(id).classList.remove('hide'));
    $('tint').style.backgroundColor = it.tint;
    const p = list[(i - 1 + list.length) % list.length], n = list[(i + 1) % list.length];
    $('prev').src = list.length > 1 ? src(p) : ''; $('next').src = list.length > 1 ? src(n) : '';
    $('prev').style.opacity = $('next').style.opacity = list.length > 1 ? '' : 0;
    document.querySelectorAll('.thumb').forEach((t, n2) => t.classList.toggle('on', n2 === i));
  }, dir ? 260 : 0);
}
// Swipe on the stage.
let x0 = null;
$('stage').addEventListener('pointerdown', e => { x0 = e.clientX; });
$('stage').addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 30) { touched = true; show(dx < 0 ? 1 : -1); } });
// All items.
function openAll(open) { $('sheet').classList.toggle('closed', !open); $('veil').classList.toggle('closed', !open); }
$('open-all').onclick = e => { e.preventDefault(); touched = true; openAll(true); };
$('close-all').onclick = e => { e.preventDefault(); openAll(false); };
$('veil').onclick = () => openAll(false);
$('grid').innerHTML = ITEMS.map((it, n) =>
  `<a id="g-${n}" href="#g-${n}" data-n="${n}" class="tile block rounded-[20px] p-2 pb-2.5" style="background:linear-gradient(170deg,#fff, ${it.tint})">
     <div class="h-[92px] flex items-center justify-center"><img class="h-[80px] max-w-[88px] object-contain drop-shadow-[0_8px_10px_rgba(0,0,0,0.10)]" data-k="${it.k}" alt="${it.name}"></div>
     <div class="text-[12px] leading-[15px] font-medium mt-1.5 px-1">${it.name}</div></a>`).join('');
fillImages($('grid'));
$('grid').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); section = 'Всё'; list = ITEMS; renderSections(); renderStrip(); openAll(false); show(1, +a.dataset.n); });

renderSections(); renderStrip(); show(0);
// Until the first touch, the studio turns through the pieces on its own, to show the light change.
timer = setInterval(() => { if (!touched) show(1); else clearInterval(timer); }, 3800);
</script>
</body>
</html>
