<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Профиль — Студия</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .f { font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .base { background: radial-gradient(80% 50% at 50% 44%, #FFFFFF 0%, #F2F2F0 60%, #E4E4E1 100%); }
  .tint { position: absolute; inset: 0; transition: background-color 1.1s ease; mix-blend-mode: multiply; pointer-events: none;
          -webkit-mask-image: radial-gradient(60% 34% at 50% var(--ty,44%), #000 0%, rgba(0,0,0,.55) 45%, transparent 80%);
                  mask-image: radial-gradient(60% 34% at 50% var(--ty,44%), #000 0%, rgba(0,0,0,.55) 45%, transparent 80%); }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)) } 50% { transform: translateY(-9px) rotate(var(--r,0deg)) } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes sheen { 0% { transform: translateX(-140%) } 60%,100% { transform: translateX(260%) } }
  .float { animation: float var(--t,5s) ease-in-out infinite; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .glass { background: rgba(255,255,255,.55); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px rgba(0,0,0,.08); }
  .sheen::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); animation: sheen 4.5s ease-in-out infinite; }
  .swap { transition: opacity .35s ease, transform .35s ease, filter .35s ease; }
  .swap.hide { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  .noscroll::-webkit-scrollbar { display: none; }

  .row { display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 16px; }
  .row + .row { border-top: 1px solid rgba(0,0,0,.06); }
  .switch { width: 46px; height: 28px; border-radius: 999px; background: #D7D9DC; position: relative; transition: background .3s ease; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .switch.on { background: #121417; } .switch.on::after { transform: translateX(18px); }

</style>
</head>
<body>
<div id="app" class="base f relative mx-auto overflow-hidden text-[#121417] select-none" style="width:390px;height:844px;">

  <div class="tint" style="background-color:#E3E7EE;--ty:20%"></div>
  <div class="relative">
    <div class="h-[54px]"></div>
    <div class="px-5 rise">
      <h1 class="text-[34px] leading-[40px] font-semibold tracking-[-1px]">Профиль</h1>
    </div>
    <div class="px-5 mt-4 flex items-center gap-4 rise" style="animation-delay:.05s">
      <div class="w-[64px] h-[64px] rounded-full bg-[#121417] text-white flex items-center justify-center text-[24px] font-semibold">А</div>
      <div><p class="text-[20px] font-semibold tracking-[-0.4px]">Аня</p><p class="text-[13px] text-[#6E737B]">Вход по логину и паролю</p></div>
    </div>

    <!-- The photo every look is tried on -->
    <div class="mx-4 mt-4 glass rounded-[28px] p-3 flex gap-3 items-center rise" style="animation-delay:.1s">
      <img class="w-[74px] h-[100px] rounded-[18px] object-cover" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/9beaebe2-7f09-4452-b892-15bff5f484a0/content-assets/tryon-f1/f1.jpg" alt="Фото для примерки">
      <div class="flex-1">
        <p class="text-[15px] font-semibold">Фото для примерки</p>
        <p class="text-[12px] leading-[17px] text-[#5F646C] mt-0.5">В полный рост, руки опущены. На нём мы показываем образы.</p>
        <a id="photo" href="#photo" class="inline-flex mt-2 h-[32px] px-3.5 rounded-full bg-[#121417] text-white items-center text-[12px] font-semibold">Заменить</a>
      </div>
    </div>

    <!-- What the stylist should lean to -->
    <div class="mx-4 mt-3 glass rounded-[24px] p-4 rise" style="animation-delay:.13s">
      <div class="flex items-baseline justify-between"><span class="text-[15px] font-semibold">Мои стили</span><span class="text-[12px] text-[#6E737B]">учитываем в идеях</span></div>
      <div id="styles" class="mt-3 flex flex-wrap gap-2 text-[13px] font-semibold">
        <a id="st-1" href="#st" class="h-[34px] px-3.5 rounded-full bg-[#121417] text-white flex items-center">Кэжуал</a>
        <a id="st-2" href="#st" class="h-[34px] px-3.5 rounded-full bg-[#121417] text-white flex items-center">Минимализм</a>
        <a id="st-3" href="#st" class="h-[34px] px-3.5 rounded-full bg-white/70 flex items-center">Смарт-кэжуал</a>
        <a id="st-4" href="#st" class="h-[34px] px-3.5 rounded-full bg-white/70 flex items-center">Old money</a>
        <a id="st-5" href="#st" class="h-[34px] px-3.5 rounded-full bg-white/70 flex items-center">Стритвир</a>
        <a id="st-6" href="#st" class="h-[34px] px-3.5 rounded-full bg-white/70 flex items-center">Романтичный</a>
      </div>
    </div>

    <div class="mx-4 mt-3 glass rounded-[24px] text-[15px] rise" style="animation-delay:.15s">
      <a id="gender" href="#gender" class="row"><span>Пол</span><span class="text-[#6E737B] flex items-center gap-1">Женский<iconify-icon icon="ph:caret-right" class="text-[14px]"></iconify-icon></span></a>
      <div class="row"><span>Советы по макияжу и укладке</span><a id="beauty" href="#beauty" class="switch on"></a></div>
      <a id="lang" href="#lang" class="row"><span>Язык</span><span class="text-[#6E737B] flex items-center gap-1">Русский<iconify-icon icon="ph:caret-right" class="text-[14px]"></iconify-icon></span></a>
    </div>
    <div class="mx-4 mt-3 flex gap-2 text-[14px] rise" style="animation-delay:.2s">
      <a id="help" href="#help" class="glass flex-1 h-[48px] rounded-full flex items-center justify-center font-semibold">Как это работает</a>
      <a id="logout" href="#logout" class="glass px-6 h-[48px] rounded-full flex items-center justify-center font-semibold text-[#C62828]">Выйти</a>
    </div>
  </div>
<div class="absolute left-5 right-5 bottom-[26px] glass rounded-full h-[62px] flex items-center justify-around px-2 z-20"><a id="tab-wardrobe" href="#wardrobe" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:coat-hanger" class="text-[23px]"></iconify-icon></a><a id="tab-fitting" href="#fitting" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:person-simple" class="text-[22px]"></iconify-icon></a><a id="tab-ideas" href="#ideas" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:stack" class="text-[21px]"></iconify-icon></a><a id="tab-saved" href="#saved" class="w-[44px] h-[44px] flex items-center justify-center text-[#4A4F57]"><iconify-icon icon="ph:heart" class="text-[21px]"></iconify-icon></a><a id="tab-profile" href="#profile" class="h-[46px] px-4 rounded-full bg-[#121417] text-white flex items-center gap-2 text-[13px] font-semibold"><iconify-icon icon="ph:user" class="text-[19px]"></iconify-icon>Профиль</a></div>
</div>
<script>
document.getElementById('beauty').onclick = e => { e.preventDefault(); e.currentTarget.classList.toggle('on'); };
</script>
</body>
</html>
