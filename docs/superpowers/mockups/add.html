<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вещь — Студия</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .f { font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .base { background: radial-gradient(80% 50% at 50% 44%, #FFFFFF 0%, #F2F2F0 60%, #E4E4E1 100%); }
  .tint { position: absolute; inset: 0; transition: background-color 1.1s ease; mix-blend-mode: multiply; pointer-events: none;
          -webkit-mask-image: radial-gradient(60% 34% at 50% var(--ty,44%), #000 0%, rgba(0,0,0,.55) 45%, transparent 80%);
                  mask-image: radial-gradient(60% 34% at 50% var(--ty,44%), #000 0%, rgba(0,0,0,.55) 45%, transparent 80%); }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)) } 50% { transform: translateY(-9px) rotate(var(--r,0deg)) } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes sheen { 0% { transform: translateX(-140%) } 60%,100% { transform: translateX(260%) } }
  .float { animation: float var(--t,5s) ease-in-out infinite; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .glass { background: rgba(255,255,255,.55); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px rgba(0,0,0,.08); }
  .sheen::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); animation: sheen 4.5s ease-in-out infinite; }
  .swap { transition: opacity .35s ease, transform .35s ease, filter .35s ease; }
  .swap.hide { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  .noscroll::-webkit-scrollbar { display: none; }

  @keyframes sweep { 0% { transform: translateY(-40px); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translateY(330px); opacity: 0 } }
  .beam { position: absolute; left: 30px; right: 30px; height: 70px; background: linear-gradient(180deg, transparent, rgba(255,255,255,.95) 50%, transparent); mix-blend-mode: screen; animation: sweep 1.6s ease-in-out 2; filter: blur(2px); }
  .line { position: absolute; left: 40px; right: 40px; height: 1.5px; background: rgba(255,255,255,.95); box-shadow: 0 0 18px 4px rgba(255,255,255,.9); animation: sweep 1.6s ease-in-out 2; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.92); filter: blur(6px) } to { opacity: 1; transform: none; filter: none } }
  .tag { opacity: 0; animation: pop .6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes cut { from { filter: drop-shadow(0 0 0 rgba(0,0,0,0)) saturate(.4) brightness(1.15) } to { filter: drop-shadow(0 22px 26px rgba(0,0,0,.18)) } }
  .item { animation: cut 1.2s ease 3.1s both; }

</style>
</head>
<body>
<div id="app" class="base f relative mx-auto overflow-hidden text-[#121417] select-none" style="width:390px;height:844px;">

  <div class="tint" style="background-color:#C9CEDA;--ty:38%"></div>
  <div class="relative h-[844px]">
    <div class="h-[54px]"></div>
    <div class="px-5 flex items-center justify-between">
      <a id="back" href="#back" class="glass w-[38px] h-[38px] rounded-full flex items-center justify-center"><iconify-icon icon="ph:x" class="text-[16px]"></iconify-icon></a>
      <span class="text-[15px] font-semibold">Новая вещь</span>
      <a id="retake" href="#retake" class="glass w-[38px] h-[38px] rounded-full flex items-center justify-center"><iconify-icon icon="ph:camera-rotate" class="text-[17px]"></iconify-icon></a>
    </div>

    <!-- The photo is read: a light passes over the piece, the background falls away, what was found appears beside it -->
    <div class="relative h-[430px] mt-3 overflow-hidden">
      <div class="float absolute left-0 right-0 top-[30px] flex justify-center" style="--t:6s">
        <img class="item w-[268px] object-contain" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/9beaebe2-7f09-4452-b892-15bff5f484a0/content-assets/cutout-h/h.png" alt="Свитшот с вышивкой">
      </div>
      <div class="beam top-[20px]"></div>
      <div class="line top-[54px]"></div>
      <span class="tag glass absolute left-[18px] top-[64px] rounded-full h-[34px] px-3.5 flex items-center text-[13px] font-semibold" style="animation-delay:3.2s">Свитшот</span>
      <span class="tag glass absolute right-[16px] top-[118px] rounded-full h-[34px] pl-2 pr-3.5 flex items-center gap-2 text-[13px] font-semibold" style="animation-delay:3.45s"><span class="w-[18px] h-[18px] rounded-full bg-[#232B3B]"></span>Тёмно-синий</span>
      <span class="tag glass absolute left-[24px] top-[226px] rounded-full h-[34px] px-3.5 flex items-center text-[13px] font-semibold" style="animation-delay:3.7s">Хлопок</span>
      <span class="tag glass absolute right-[30px] top-[268px] rounded-full h-[34px] px-3.5 flex items-center text-[13px] font-semibold" style="animation-delay:3.95s">Осень и зима</span>
    </div>

    <!-- What to save: the name, and the one place to correct what was read -->
    <div class="absolute left-4 right-4 bottom-[28px] glass rounded-[30px] p-4 tag" style="animation-delay:4.2s">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-[12px] text-[#6E737B]">Название</p>
          <p class="text-[22px] leading-[28px] font-semibold tracking-[-0.5px] mt-0.5">Свитшот с вышивкой</p>
        </div>
        <span class="shrink-0 mt-1 h-[30px] px-3 rounded-full bg-white/70 flex items-center text-[12px] font-semibold">Верх</span>
      </div>
      <!-- The card picture: the smoothed one or the original cut-out -->
      <div class="mt-3 bg-black/[0.05] rounded-full p-[3px] flex text-[13px] font-semibold">
        <a id="flat" href="#flat" class="flex-1 h-[34px] rounded-full bg-white shadow-sm flex items-center justify-center gap-1.5"><iconify-icon icon="ph:magic-wand" class="text-[15px]"></iconify-icon>Ровное фото</a>
        <a id="orig" href="#orig" class="flex-1 h-[34px] rounded-full flex items-center justify-center text-[#5F646C]">Исходное</a>
      </div>
      <div class="mt-3 flex gap-2">
        <a id="save-item" href="#save" class="relative overflow-hidden sheen flex-1 h-[50px] rounded-full bg-[#121417] text-white flex items-center justify-center text-[15px] font-semibold">В гардероб</a>
        <a id="edit-item" href="#edit" class="glass px-5 h-[50px] rounded-full flex items-center justify-center text-[15px] font-semibold">Изменить</a>
      </div>
    </div>
  </div>

</div>
</body>
</html>
