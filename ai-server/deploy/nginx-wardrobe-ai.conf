# /etc/nginx/sites-available/wardrobe-ai  (+ symlink в sites-enabled)
# __HOST__ заменить на домен. Без своего домена работает трюк с nip.io/sslip.io:
#   <IP>.nip.io  и  <IP>.sslip.io  резолвятся в этот же IP, Let's Encrypt их принимает.
# После правки:  certbot --nginx -d __HOST__   (сам допишет 443-блок и редирект с 80)

# Лимиты по IP. Файл подключается внутри http{}, поэтому зоны объявляются здесь.
# Платная примерка — строго; анализ вещей (CPU, rembg) — мягче: гардероб добавляют пачкой.
limit_req_zone $binary_remote_addr zone=wardrobe_tryon:10m   rate=4r/m;
limit_req_zone $binary_remote_addr zone=wardrobe_analyze:10m rate=30r/m;

server {
    listen 80;
    server_name __HOST__;

    # мобильный клиент шлёт фото — дефолтного 1m не хватает
    client_max_body_size 30m;
    limit_req_status 429;

    # Общие настройки проксирования на uvicorn (слушает только 127.0.0.1).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # генерация лука через FASHN идёт до 240 c
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Наружу — только то, что вызывает мобильное приложение.
    location = /tryon-generate-look {
        limit_req zone=wardrobe_tryon burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /analyze {
        limit_req zone=wardrobe_analyze burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # /docs, /openapi.json, /tryon-model, /tryon-avatar, /tryon-generate — только локально
    # (curl http://127.0.0.1:8000/... на самом сервере).
    location / {
        return 404;
    }
}
