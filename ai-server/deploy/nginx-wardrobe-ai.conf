# /etc/nginx/sites-available/wardrobe-ai  (+ symlink в sites-enabled)
# __HOST__ заменить на домен. Без своего домена работает трюк с nip.io/sslip.io:
#   <IP>.nip.io  и  <IP>.sslip.io  резолвятся в этот же IP, Let's Encrypt их принимает.
# После правки:  certbot --nginx -d __HOST__   (сам допишет 443-блок и редирект с 80)
server {
    listen 80;
    server_name __HOST__;

    # мобильный клиент шлёт фото — дефолтного 1m не хватает
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # генерация лука через FASHN идёт до 240 c
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
