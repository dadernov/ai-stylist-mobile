<h1>AI 造型师 支持</h1>
<p>请发送邮件至：<a href="mailto:mrbdigital@proton.me">mrbdigital@proton.me</a>。我们会在两个工作日内回复。</p>
<h2>如何删除账户</h2>
<p>“个人”→“删除账户”→确认。账户和数据会从服务器和设备上删除。如果无法使用应用，请用需要删除的登录名给我们发邮件。</p>
<h2>试穿无法开始</h2>
<p>需要一张只有一个人且面部清晰可见的全身照，以及至少一件带照片的单品。如果提示额度已用完，每日额度会在明天恢复。</p>
<h2>如何保存结果</h2>
<p>在试穿结果下方点击“保存到相册”，并允许保存照片。</p>
<h2>语言</h2>
<p>支持俄语、英语和中文。可在“个人”→“语言”中更改。</p>
